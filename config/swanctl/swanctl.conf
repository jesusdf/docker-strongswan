connections {

    # Server connection accepting clients with certificate (pubkey) authentication.
    roadwarrior {
        version = 2
        proposals = chacha20poly1305-prfsha256-newhope128,chacha20poly1305-prfsha256-ecp256,aes128gcm16-prfsha256-ecp256,aes256-sha256-modp2048,aes256-sha256-modp1024
        rekey_time = 60m
        dpd_delay = 120s
        pools = vpn-pool, vpn-pool-v6

        local {
            auth = pubkey
            id = moon.strongswan.org
            certs = serverCert.pem
            send_cert = always
        }
        remote {
            auth = pubkey
        }
        children {
            roadwarrior {
                local_ts = 0.0.0.0/0, ::/0
                esp_proposals = chacha20poly1305-newhope128,chacha20poly1305-ecp256,aes128gcm16-ecp256,aes256-sha256-modp2048,aes256-sha256,aes256-sha1
                rekey_time = 20m
                dpd_action = clear
                updown = /etc/swanctl/updown/firewall.updown
                start_action = none
            }
        }
    }

    # Server connection accepting clients with EAP authentication.
    roadwarrior-eap {
        version = 2
        proposals = chacha20poly1305-prfsha256-newhope128,chacha20poly1305-prfsha256-ecp256,aes128gcm16-prfsha256-ecp256,aes256-sha256-modp2048,aes256-sha256-modp1024
        rekey_time = 60m
        dpd_delay = 120s
        pools = vpn-pool, vpn-pool-v6

        local {
            auth = pubkey
            id = moon.strongswan.org
            certs = serverCert.pem
            send_cert = always
        }
        remote {
            auth = eap-dynamic
            eap_id = %any
        }
        children {
            roadwarrior-eap {
                local_ts = 0.0.0.0/0, ::/0
                esp_proposals = chacha20poly1305-newhope128,chacha20poly1305-ecp256,aes128gcm16-ecp256,aes256-sha256-modp2048,aes256-sha256,aes256-sha1
                rekey_time = 20m
                dpd_action = clear
                updown = /etc/swanctl/updown/firewall.updown
                start_action = none
            }
        }
    }

    # Server connection accepting clients with certificate + EAP (two auth rounds).
    roadwarrior-pubkey-eap {
        version = 2
        proposals = chacha20poly1305-prfsha256-newhope128,chacha20poly1305-prfsha256-ecp256,aes128gcm16-prfsha256-ecp256,aes256-sha256-modp2048,aes256-sha256-modp1024
        rekey_time = 60m
        dpd_delay = 120s
        pools = vpn-pool, vpn-pool-v6

        local {
            auth = pubkey
            id = moon.strongswan.org
            certs = serverCert.pem
            send_cert = always
        }
        remote-1 {
            auth = pubkey
        }
        remote-2 {
            auth = eap-dynamic
            eap_id = %any
        }
        children {
            roadwarrior-pubkey-eap {
                local_ts = 0.0.0.0/0, ::/0
                esp_proposals = chacha20poly1305-newhope128,chacha20poly1305-ecp256,aes128gcm16-ecp256,aes256-sha256-modp2048,aes256-sha256,aes256-sha1
                rekey_time = 20m
                dpd_action = clear
                updown = /etc/swanctl/updown/firewall.updown
                start_action = none
            }
        }
    }

    # Client connection to moon.strongswan.org using EAP authentication.
    home {
        version = 2
        remote_addrs = moon.strongswan.org
        proposals = chacha20poly1305-prfsha256-newhope128,chacha20poly1305-prfsha256-ecp256,aes128gcm16-prfsha256-ecp256,aes256-sha256-modp2048,aes256-sha256-modp1024
        rekey_time = 60m
        dpd_delay = 120s
        vips = 0.0.0.0, ::

        local {
            auth = eap
            id = carol
            eap_id = %identity
        }
        remote {
            auth = pubkey
            id = moon.strongswan.org
        }
        children {
            home {
                remote_ts = 0.0.0.0/0, ::/0
                esp_proposals = chacha20poly1305-newhope128,chacha20poly1305-ecp256,aes128gcm16-ecp256,aes256-sha256-modp2048,aes256-sha256,aes256-sha1
                rekey_time = 20m
                dpd_action = clear
                start_action = none
            }
        }
    }

}

pools {

    vpn-pool {
        addrs = 192.168.12.0/24
        dns = 8.8.8.8, 2001:4860:4860::8888
    }

    vpn-pool-v6 {
        addrs = fdef:a51d:f888::/112
        dns = 2001:4860:4860::8888
    }

}

secrets {

    private {
        file = serverKey.pem
    }

    eap-carol {
        id = carol
        secret = Ar3etTnp01qlpOgb
    }

}

# Include additional config snippets
include conf.d/*.conf
